<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Doto:wght@100..900&family=Edu+AU+VIC+WA+NT+Pre:wght@400..700&family=Fascinate+Inline&family=Fredericka+the+Great&family=Grenze+Gotisch:wght@100..900&family=Honk:MORF@15&family=Princess+Sofia&family=Rampart+One&family=Rubik+Beastly&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        header,footer {
            background-color: #183C63;
            color: #FFFFFF;
            border: 5px double #000000;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #FFFFFF;
            color: #183C63;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
            text-align: center;
         }

        .negrito{
            font-weight: bold;
        }

        
        .honk-uniquifier {
        font-family: "Honk", system-ui;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings:
            "MORF" 15,
            "SHLN" 50;
        }

    </style>
</head>
<body>
    <header>
        <h1 class="honk-uniquifier">Construindo uma página da Web</h1>
        <p>Conteúdo da prova do 1ºA</p>
    </header>    
    <main>
        <img src="https://cdn-icons-png.flaticon.com/512/6114/6114045.png" alt="ícone de um blog">
        <div>
            <h2>Principais códigos</h2>
            <p class="negrito">Estude-os com atenção!</p>
            <p>main é a sessão principal, é uma tag de estrutura para melhor organização do código</p>
        </div>
    </main>
    <footer>
        <img src="images.png" alt="">
        <p>Projeto criado pela prof em conjunto com o 1ºA</p>
    </footer>
</body>
</html>
